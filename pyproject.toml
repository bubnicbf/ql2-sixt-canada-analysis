[build-system]
# setuptools >= 64 supports PEP 660 editable installs (pip install -e .).
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ql2-sixt-canada-analysis"
version = "0.1.0"
description = "Data-quality and pricing analysis of an hourly Sixt Canada rate feed."
readme = "README.md"
requires-python = ">=3.11"
# Runtime libraries used by the analysis code.
dependencies = [
    "pandas",
    "numpy",
    "pyarrow",
    "matplotlib",
    "seaborn",
    "scipy",
]

[project.optional-dependencies]
# Development tools: test runner (packaging is used directly by the tests)
# and the notebook environment.
dev = [
    "pytest>=8",
    "packaging",
    "jupyterlab",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
