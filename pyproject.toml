[project]
name = "ql2-sixt-canada-analysis"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "jupyterlab",
    "pandas",
    "numpy",
    "pyarrow",
    "matplotlib",
    "seaborn",
    "scipy",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
