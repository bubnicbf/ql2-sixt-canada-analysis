[[decisions]]
id = "JOB_ID_DECIMAL_ZERO_EQUIVALENCE"
status = "APPROVED"
responsible_authority = ["COLLECTION_OWNER", "SUPPLIER"]
joint = false
question = "Is a job identifier written with a trailing decimal-zero suffix the same identifier as the same digits written without it?"
blocking_external_input = false
downstream = ["key_contracts_invalid", "one_to_many_invalid", "declared_counts_not_reconciled", "orphan_details_present", "trusted_join_not_ready"]

[[decisions.evidence]]
kind = "RAW_DATA_OBSERVATION"
summary = "In the local raw extract the detail-side job identifier is serialized with a decimal-zero suffix that the parent-side identifier lacks; removing that suffix in memory made counts reconcile. This is an observation of the extract, not a supplier or collection-owner rule."
reference = "docs/investigations/pricing_readiness_baseline.md"

[[decisions.authority]]
kind = "COLLECTION_OWNER"
source = "Collection owner: collection-governance meeting outcome supplied by the repository owner"
reference = "docs/decisions/governance/job-identifier-governance-2026-10-06.md"
note = "Recorded in the repository on 2026-10-06. Meeting date, participants, organizations and tickets were not supplied."

[decisions.resolution]
equivalence = "LEGACY_DETAIL_EXPORT_REPAIR_ONLY"
cause = "SPREADSHEET_SERIALIZATION_DEFECT"
detail_field = "cars.job_id"
parent_field = "jobs.job_id"
pattern = "ASCII_DIGITS_THEN_SINGLE_DECIMAL_ZERO"
match_order = "EXACT_FIRST"
parent_match = "UNIQUE_REQUIRED"
offer_position = "NONNEGATIVE_INTEGER_WITH_LEGACY_DECIMAL_ZERO"

